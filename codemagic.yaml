workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          cd $CM_BUILD_DIR
          pod install
      - name: Build
        script: |
          cd $CM_BUILD_DIR
          xcodebuild build -workspace MedicationReminder.xcworkspace -scheme MedicationReminder -configuration Release
      - name: Test
        script: |
          cd $CM_BUILD_DIR
          xcodebuild test -workspace MedicationReminder.xcworkspace -scheme MedicationReminder -configuration Debug
    artifacts:
      - build/Release-iphoneos/**/*.ipa
      - build/Release-iphoneos/**/*.app
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
